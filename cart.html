<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTOR-X — Кошик</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZLY03GZRV6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZLY03GZRV6');
    </script>
</head>
<body>

    <!-- Шапка сайту -->
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="https://api.logikaschool.com.ua/media/library/7cae4d15_logo.png" alt="MOTOR-X Logo">
                </a>
            </div>
            <nav class="nav">
                <a href="index.html" class="nav-link">Автомобілі</a>
                <a href="parts.html" class="nav-link">Автозапчастини та мастила</a>
                <a href="contacts.html" class="nav-link">Контакти</a>
            </nav>
            <div class="header-actions">
                <a href="cart.html" class="cart-btn" id="cartToggleBtn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </a>
                <div class="user-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Секція: Кошик -->
    <section class="section cart-section" id="cart">
        <div class="container">
            <div class="section-title">
                <h2>Ваш кошик</h2>
            </div>
            <div class="cart-container" id="cartContainer">
                <div class="empty-cart-msg">Ваш кошик порожній</div>
            </div>
            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div class="summary-total">Разом: <span id="cartTotalPrice">0 грн</span></div>
                <div class="cart-actions-row">
                    <a href="index.html" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Продовжити покупки</a>
                    <button class="btn-checkout" id="checkoutBtn"><i class="fa-solid fa-wallet"></i> Оформити замовлення</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Футер -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MOTOR-X</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
